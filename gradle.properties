# 提高 Gradle 可用内存。
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# 插件基本信息（Bukkit / Spigot / Paper / Purpur 插件）
# ---------------------------------------------------------------------------
plugin_name=MCMultiLoginCompat
plugin_main=net.wifil.mcmultilogin.MultiLoginPlugin
plugin_version=2.0.0
maven_group=net.wifil.mcmultilogin
archives_base_name=mc-multilogin-compat-bukkit

# plugin.yml 里声明的 api-version。
# 它不是「最低运行版本」，只表示按 1.13+ 的新数据语义解释插件；
# 填得越低，同一个 JAR 能覆盖的版本区间越大（1.8~1.12 的服务端会直接忽略该字段）。
bukkit_api_version=1.13

# ---------------------------------------------------------------------------
# 仅编译期依赖（compileOnly，不会打进产物）
# ---------------------------------------------------------------------------
# 目标服务端：Purpur 26.1.2（Paper 26.1.2 的 drop-in 分支，插件层与 NMS 层一致）
paper_api_version=26.1.2.build.74-stable
# 只用到 io.netty.channel.* 与 io.netty.util.AttributeKey，
# 运行期是 Netty 4.x 任意小版本都可以（实测目标服务端自带 4.2.7.Final）。
netty_version=4.1.115.Final
gson_version=2.13.2

# 产物字节码级别。定为 8 才能让同一个 JAR 在所有 Java 8+ 服务端上都加载得起来，
# 这是「全版本兼容」这个说法能站得住的技术前提。
java_release=8
